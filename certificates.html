<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الشهادات والإنجازات | إنجازي</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at 80% 10%,rgba(14,165,233,.14),transparent 32%),
        #070d18;
    color:#fff;
    line-height:1.8;
    min-height:100vh;
}


/* الشريط العلوي */

header{
    width:100%;
    min-height:72px;
    padding:15px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#080f1b;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    color:#22d3ee;
    font-size:26px;
    font-weight:bold;
}

.back{
    color:#cbd5e1;
    text-decoration:none;
    transition:.3s;
}

.back:hover{
    color:#22d3ee;
}


/* الواجهة */

.hero{
    min-height:310px;
    padding:55px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
        radial-gradient(circle at top right,rgba(14,165,233,.30),transparent 40%),
        linear-gradient(135deg,#0f172a,#082f49,#0f172a);
}

.hero-content{
    max-width:850px;
}

.badge{
    display:inline-block;
    padding:7px 20px;
    border:1px solid #22d3ee;
    border-radius:30px;
    color:#67e8f9;
    margin-bottom:18px;
    background:rgba(34,211,238,.08);
}

.hero h1{
    font-size:46px;
    margin-bottom:10px;
}

.hero p{
    color:#cbd5e1;
    font-size:17px;
}


/* المحتوى */

.container{
    width:92%;
    max-width:1250px;
    margin:55px auto;
}

.section-title{
    text-align:center;
    margin-bottom:38px;
}

.section-title h2{
    font-size:36px;
    margin-bottom:5px;
}

.section-title p{
    color:#94a3b8;
}


/* شبكة الشهادات */

.grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

.card{
    overflow:hidden;
    border-radius:21px;
    background:linear-gradient(145deg,#111c2e,#0d1726);
    border:1px solid rgba(255,255,255,.08);
    transition:.3s;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(34,211,238,.65);
    box-shadow:0 15px 38px rgba(0,0,0,.28);
}


/* المعاينة */

.preview{
    width:100%;
    height:240px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#e5e7eb;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.pdf-icon{
    font-size:75px;
}


/* تفاصيل البطاقة */

.card-body{
    padding:20px;
}

.card h3{
    font-size:19px;
    margin-bottom:7px;
}

.file-name{
    color:#64748b;
    font-size:12px;
    direction:ltr;
    text-align:right;
    word-break:break-all;
    min-height:22px;
}

.open-btn{
    display:block;
    margin-top:17px;
    padding:10px 15px;
    text-align:center;
    text-decoration:none;
    border-radius:11px;
    background:linear-gradient(135deg,#22d3ee,#38bdf8);
    color:#07111f;
    font-weight:bold;
    transition:.3s;
}

.open-btn:hover{
    transform:translateY(-2px);
    background:#67e8f9;
}


/* حالات التحميل */

.loading,
.empty,
.error{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    border-radius:18px;
    background:rgba(255,255,255,.03);
    color:#94a3b8;
    font-size:17px;
}


/* التذييل */

footer{
    margin-top:65px;
    padding:32px 20px;
    text-align:center;
    background:#050a12;
    color:#94a3b8;
    border-top:1px solid rgba(255,255,255,.07);
}

footer strong{
    color:#22d3ee;
}


/* التابلت */

@media(max-width:900px){

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}


/* الجوال */

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:35px;
    }

    .hero p{
        font-size:15px;
    }

    .container{
        width:94%;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        إنجازي
    </div>

    <a href="index.html" class="back">
        العودة للرئيسية ←
    </a>

</header>



<section class="hero">

    <div class="hero-content">

        <span class="badge">
            ملف الإنجاز المهني
        </span>

        <h1>
            الشهادات والإنجازات
        </h1>

        <p>
            معرض رقمي لشهادات الشكر والتقدير والدورات
            والإنجازات المهنية
        </p>

    </div>

</section>



<main class="container">

    <div class="section-title">

        <h2>
            معرض الشهادات
        </h2>

        <p id="counter">
            جاري تحميل الشهادات...
        </p>

    </div>


    <div class="grid" id="certificatesGrid">

        <div class="loading">
            جاري تحميل الشهادات...
        </div>

    </div>

</main>



<footer>

    منصة <strong>إنجازي</strong>

    <br>

    الأستاذ / عامر بن عبده المحجاني

    <br>

    «إنجاز اليوم... أثر يبقى للغد»

</footer>



<script>

const owner = "alaaasiri90-oss";
const repo = "amer-injazi";

const grid = document.getElementById("certificatesGrid");
const counter = document.getElementById("counter");


function encodePath(path){

    return path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

}


function validCertificate(path){

    const lowerPath = path.toLowerCase();

    const fileName =
        lowerPath.split("/").pop();

    const validExtension =
        /\.(jpg|jpeg|png|webp|pdf)$/i.test(fileName);

    if(!validExtension){
        return false;
    }

    return (
        lowerPath.startsWith("certificates/") ||
        fileName.startsWith("certificate") ||
        /^\d+\.(jpg|jpeg|png|webp|pdf)$/i.test(fileName)
    );

}


function naturalSort(a,b){

    return a.path.localeCompare(
        b.path,
        undefined,
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}


async function loadCertificates(){

    try{

        const api =
            "https://api.github.com/repos/" +
            owner +
            "/" +
            repo +
            "/git/trees/main?recursive=1";

        const response = await fetch(api);


        if(!response.ok){

            throw new Error(
                "GitHub API error: " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!data.tree){

            throw new Error(
                "لم يتم العثور على شجرة الملفات"
            );

        }


        let files =
            data.tree.filter(item => {

                return (
                    item.type === "blob" &&
                    validCertificate(item.path)
                );

            });


        files.sort(naturalSort);


        grid.innerHTML = "";


        if(files.length === 0){

            counter.textContent =
                "لا توجد شهادات معروضة حاليًا";

            grid.innerHTML =
            `
                <div class="empty">
                    لم يتم العثور على ملفات شهادات.
                </div>
            `;

            return;

        }


        counter.textContent =
            "عدد الشهادات المعروضة: " +
            files.length;


        files.forEach((file,index) => {

            const encodedPath =
                encodePath(file.path);


            const rawURL =
                "https://raw.githubusercontent.com/" +
                owner +
                "/" +
                repo +
                "/main/" +
                encodedPath;


            const extension =
                file.path
                .split(".")
                .pop()
                .toLowerCase();


            const isPDF =
                extension === "pdf";


            const fileName =
                file.path
                .split("/")
                .pop();


            const card =
                document.createElement("div");


            card.className =
                "card";


            let previewHTML;


            if(isPDF){

                previewHTML =
                `
                    <div class="preview">
                        <div class="pdf-icon">
                            📄
                        </div>
                    </div>
                `;

            }

            else{

                previewHTML =
                `
                    <div class="preview">

                        <img
                            src="${rawURL}"
                            alt="شهادة رقم ${index + 1}"
                            loading="lazy"
                        >

                    </div>
                `;

            }


            card.innerHTML =
            `
                ${previewHTML}

                <div class="card-body">

                    <h3>
                        شهادة رقم ${index + 1}
                    </h3>

                    <div class="file-name">
                        ${fileName}
                    </div>

                    <a
                        href="${rawURL}"
                        target="_blank"
                        rel="noopener"
                        class="open-btn"
                    >
                        عرض الشهادة
                    </a>

                </div>
            `;


            grid.appendChild(card);

        });

    }

    catch(error){

        console.error(error);


        counter.textContent =
            "تعذر تحميل الشهادات";


        grid.innerHTML =
        `
            <div class="error">

                تعذر تحميل الشهادات حاليًا.

                <br>

                يرجى تحديث الصفحة والمحاولة مرة أخرى.

            </div>
        `;

    }

}


loadCertificates();

</script>


</body>
</html>
