<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>السيرة الذاتية | إنجازي</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #0b1220, #111827);
      color: #fff;
      line-height: 1.8;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      padding: 30px 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      color: #22d3ee;
    }

    .back-btn {
      text-decoration: none;
      background: #22d3ee;
      color: #0f172a;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #67e8f9;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .card h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #ffffff;
      text-align: center;
    }

    .card p {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .cv-image {
      width: 100%;
      border-radius: 18px;
      display: block;
      border: 3px solid rgba(34,211,238,0.35);
    }

    .download-box {
      text-align: center;
      margin-top: 20px;
    }

    .download-btn {
      display: inline-block;
      text-decoration: none;
      background: #22d3ee;
      color: #0f172a;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.3s;
    }

    .download-btn:hover {
      background: #67e8f9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="title">السيرة الذاتية</div>
      <a href="index.html" class="back-btn">العودة للرئيسية</a>
    </div>

    <div class="card">
      <h1>السيرة الذاتية للأستاذ / عامر بن عبده المحجاني</h1>
      <p>عرض السيرة الذاتية والملف المهني بصورة واضحة ومنظمة.</p>

      <img src="amer-cv.jpg" alt="السيرة الذاتية للأستاذ عامر بن عبده المحجاني" class="cv-image">

      <div class="download-box">
        <a href="amer-cv.jpg" target="_blank" class="download-btn">فتح الصورة بالحجم الكامل</a>
      </div>
    </div>
  </div>
</body>
</html>
